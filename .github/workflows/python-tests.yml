name: Python safety checks

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Compile Python source
        run: python -m compileall -q app.py model_gate.py check_data.py train_real.py scripts tests
      - name: Install lightweight template test dependency
        run: python -m pip install "Flask>=3.0,<4.0"
      - name: Run regression tests
        run: python -m unittest discover -s tests -v
      - name: Confirm the legacy trainer is disabled
        shell: bash
        run: |
          set +e
          output="$(python train_real.py 2>&1)"
          status=$?
          set -e
          test "$status" -ne 0
          echo "$output" | grep -q "legacy pipeline is unsafe and has been disabled"
